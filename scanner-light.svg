<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 40" width="100%" height="40">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&amp;display=swap');
      .bg { fill: #f0f6fc; stroke: #d0d7de; stroke-width: 1; }
      .text {
        font-family: 'Share Tech Mono', monospace;
        font-size: 16px;
        fill: #0969da;
        letter-spacing: 1.5px;
        animation: glitch 4s infinite;
      }
      .scan-group { animation: scan 3s ease-in-out infinite alternate; }
      .scanner-beam { fill: url(#beamGrad); }
      .scanner-line { fill: #0969da; }
      @keyframes scan {
        0% { transform: translateX(-150px); }
        100% { transform: translateX(800px); }
      }
      @keyframes glitch {
        0%, 100% { opacity: 1; }
        92% { opacity: 1; }
        93% { opacity: 0.8; transform: skewX(-15deg); }
        94% { opacity: 1; transform: skewX(15deg); }
        95% { opacity: 0.5; transform: skewX(0); }
        96% { opacity: 1; }
      }
    </style>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0969da" stop-opacity="0" />
      <stop offset="50%" stop-color="#0969da" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0969da" stop-opacity="0.3" />
    </linearGradient>
    <clipPath id="rounded">
      <rect width="800" height="40" rx="6"/>
    </clipPath>
  </defs>
  <rect width="800" height="40" rx="6" class="bg" />
  <g clip-path="url(#rounded)">
    <text x="25" y="25" class="text">&gt; ACCESS_GRANTED // INITIATING_SECURE_PROTOCOL...</text>
    <g class="scan-group">
      <rect x="0" y="0" width="150" height="40" class="scanner-beam" />
      <rect x="148" y="0" width="3" height="40" class="scanner-line" />
    </g>
  </g>
</svg>
